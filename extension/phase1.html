    .velocity-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
}

.velocity-loader-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9999;
  display: none;
}

.velocity-loader-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.velocity-loader-content {
  background: white;
  padding: 24px;
  border-radius: 12px;
  text-align: center;
}

.velocity-loader-spinner {
  width: 40px;
  height: 40px;
  margin: 0 auto 16px;
  border: 3px solid #E5E7EB;
  border-top-color: #0284C7;
  border-radius: 50%;
  animation: velocity-spin 1s linear infinite;
}

.velocity-loader-message {
  color: #1F2937;
  font-size: 14px;
}

.velocity-loader-text {
  color: #1F2937;
  font-size: 14px;
  line-height: 1.4;
}

@keyframes velocity-spin {
  to { transform: rotate(360deg); }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Dark mode styles */
.dark-mode .velocity-loader-content {
  background: #1F2937;
}

.dark-mode .velocity-loader-text {
  color: #F3F4F6;
}

.velocity-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.velocity-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #f3f3f3;
  border-top: 3px solid #0284C7;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.velocity-loader-text {
  color: white;
  font-size: 14px;
  text-align: center;
}

.velocity-scroll-indicator {
  position: absolute;
  right: 16px;
  bottom: 16px;
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 8px 12px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 1;
  transition: opacity 0.3s ease;
}

.velocity-scroll-icon {
  width: 24px;
  height: 24px;
  border: 2px solid #0284C7;
  border-radius: 12px;
  position: relative;
}

.velocity-scroll-dot {
  position: absolute;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  background: #0284C7;
  border-radius: 50%;
  animation: scrollBounce 1.5s infinite;
}

.velocity-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 12px 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 24px;
}

.velocity-error-icon {
  flex-shrink: 0;
  color: rgb(239, 68, 68);
}

.velocity-error-content {
  flex-grow: 1;
  font-size: 14px;
  color: rgb(239, 68, 68);
}

.velocity-token-alert {
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.2);
  padding: 16px;
  border-radius: 8px;
  margin: 16px 24px;
}

.velocity-token-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.velocity-token-title {
  font-weight: 500;
  color: #F59E0B;
}

.velocity-token-message {
  font-size: 14px;
  color: #78350F;
  margin-bottom: 16px;
}

.velocity-token-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  background: #F59E0B;
  color: white;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes scrollBounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
  40% { transform: translateY(4px) translateX(-50%); }
  60% { transform: translateY(2px) translateX(-50%); }
}

/* Dark mode variants */
.dark-mode .velocity-error {
  background: rgba(239, 68, 68, 0.2);
}

.dark-mode .velocity-token-alert {
  background: rgba(251, 191, 36, 0.2);
}

.dark-mode .velocity-token-message {
  color: #FCD34D;
}
