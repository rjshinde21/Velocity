.premium-enhance-wrapper {
  display: flex;
  justify-content: center;
  margin: 20px auto;
  position: relative;
}

.premium-enhance-control {
  position: relative;
  width: auto;
  min-width: 300px;
  background: linear-gradient(145deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.1));
  border-radius: 12px;
  padding: 2px;
  overflow: hidden;
}

.premium-enhance-control::before {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
  border-radius: 14px;
  z-index: -1;
  animation: borderShine 3s linear infinite;
  background-size: 200% 100%;
}

.premium-enhance-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: rgba(0, 0, 0, 0.7);
  border-radius: 10px;
  backdrop-filter: blur(5px);
}

.premium-enhance-text {
  color: #fbbf24;
  font-size: 14px;
  font-weight: 500;
  margin-right: 24px;
}

.premium-toggle {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 28px;
}

.toggle-input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(251, 191, 36, 0.2);
  transition: 0.4s;
  border-radius: 34px;
}

.toggle-slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 4px;
  bottom: 4px;
  background-color: #fbbf24;
  transition: 0.4s;
  border-radius: 50%;
}
.button-group label.selected {
  background-color: rgba(0, 138, 203, 0.1);
  border-color: #008ACB;
}
.button-group label.selected .dot {
  background-color: #008ACB;
}

.toggle-input:checked + .toggle-slider {
  background-color: rgba(245, 158, 11, 0.6);
}

.toggle-input:checked + .toggle-slider:before {
  transform: translateX(24px);
}

@keyframes borderShine {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
